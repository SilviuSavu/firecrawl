name: firecrawl
x-common-service:
  build: apps/api
  ulimits: &id001
    nofile:
      soft: 65535
      hard: 65535
  networks: &id002
  - backend
  extra_hosts: &id003
  - host.docker.internal:host-gateway
  logging: &id004
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
      compress: 'true'
x-common-env:
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY}
  ZAI_API_KEY: ${ZAI_API_KEY}
  HHEM_VERIFIER_URL: ${HHEM_VERIFIER_URL}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}
services:
  playwright-service:
    restart: unless-stopped
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
    - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 4.0
    mem_limit: 3G
    memswap_limit: 3G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        compress: 'true'
    tmpfs:
    - /tmp/.cache:noexec,nosuid,size=1g
  searxng:
    image: searxng/searxng:latest
    entrypoint:
    - /bin/sh
    - /usr/local/searxng/searxng-entrypoint.sh
    restart: unless-stopped
    networks:
    - backend
    ports:
    - ${SEARXNG_HOST_PORT:-8888}:8080
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      EXA_API_KEY: ${EXA_API_KEY}
      MARGINALIA_API_KEY: ${MARGINALIA_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
    volumes:
    - ./searxng/settings.yml:/etc/searxng/settings.template.yml:ro
    - ./searxng/serpapi.py:/usr/local/searxng/searx/engines/serpapi.py:ro
    - ./searxng/bravesearch.py:/usr/local/searxng/searx/engines/bravesearch.py:ro
    - ./searxng/exa.py:/usr/local/searxng/searx/engines/exa.py:ro
    - ./searxng/zaiprime.py:/usr/local/searxng/searx/engines/zaiprime.py:ro
    - ./searxng/tavily.py:/usr/local/searxng/searx/engines/tavily.py:ro
    - ./searxng/kiwix.py:/usr/local/searxng/searx/engines/kiwix.py:ro
    - ./searxng/entrypoint.sh:/usr/local/searxng/searxng-entrypoint.sh:ro
    - searxng-cache:/var/cache/searxng
    - ./searxng/zimtitles.py:/usr/local/searxng/searx/engines/zimtitles.py:ro
    - ./searxng/offlinecorpus.py:/usr/local/searxng/searx/engines/offlinecorpus.py:ro
  scrape-proxy:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
    - api
    environment:
      LOCAL_FIRECRAWL_URL: http://api:3002
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    volumes:
    - ./scrape-proxy/server.py:/app/server.py:ro
    command: python /app/server.py
    networks:
    - backend
    ports:
    - 3003:3003
  api:
    build: apps/api
    ulimits: *id001
    networks: *id002
    extra_hosts: *id003
    logging: *id004
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
      PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY}
      ZAI_API_KEY: ${ZAI_API_KEY}
      HHEM_VERIFIER_URL: ${HHEM_VERIFIER_URL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      BULL_AUTH_KEY: ${BULL_AUTH_KEY}
      TEST_API_KEY: ${TEST_API_KEY}
      SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
      SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
      LOGGING_LEVEL: ${LOGGING_LEVEL}
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
      NUQ_BACKEND: ${NUQ_BACKEND}
      FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}
      HOST: 0.0.0.0
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-300000}
      ENV: local
      ALLOW_LOCAL_WEBHOOKS: 'true'
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
    - ${PORT:-3002}:${INTERNAL_PORT:-3002}
    volumes:
    - fdb-cluster-file:/var/fdb:ro
    command: node dist/src/harness.js --start-docker
    cpus: 4.0
    mem_limit: 16G
    memswap_limit: 16G
  redis:
    restart: unless-stopped
    image: redis:alpine
    networks:
    - backend
    command: redis-server --bind 0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
        compress: 'true'
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3-management
    networks:
    - backend
    command: rabbitmq-server
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_running
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
        compress: 'true'
  nuq-postgres:
    restart: unless-stopped
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
    - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        compress: 'true'
  foundationdb:
    restart: unless-stopped
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500
    networks:
    - backend
    volumes:
    - fdb-data:/var/fdb/data
    - fdb-cluster-file:/var/fdb
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        compress: 'true'
  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63
    depends_on:
    - foundationdb
    entrypoint:
    - /bin/bash
    - -c
    - "sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ]; then exit 0; fi; printf '%s\n' \"$$out\" | grep -Eiq 'already.*configured|database.*configured|database.*already exists'"
    volumes:
    - fdb-cluster-file:/var/fdb
    networks:
    - backend
    restart: 'no'
networks:
  backend:
    driver: bridge
volumes:
  fdb-data: null
  fdb-cluster-file: null
  searxng-cache: null
